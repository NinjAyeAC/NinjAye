name: Feature request
description: Propose a focused research or engineering change.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap does this request address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the expected behavior and affected component.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Native DLL
        - C++ SDK/example
        - ASP.NET Core server
        - PostgreSQL schema
        - Documentation/tests
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Technical evidence
      description: Link to sanitized documentation or describe the observed contract.
